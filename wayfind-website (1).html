html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--white);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}

button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.lb{display:block;margin:6px 0;font-size:12px;color:var(--mute)}

.days{display:flex;gap:6px;margin:10px 0}.days button{flex:1;padding:7px 0}
.card{margin:10px 0;padding:12px 14px;border:1px solid rgba(244,247,255,.2);border-radius:16px;background:var(--card)}
.row{display:flex;justify-content:space-between;gap:8px}.card b{font-size:15px}
.card>span{display:block;margin:3px 0;font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;color:var(--navy)}
.pill.g{background:#2aff6a}.pill.r{background:#ff5a5a}
.step{margin:12px 0;padding:14px;border:1px solid var(--gold);border-radius:16px}.step b{display:block;font-size:17px}.step p{margin:6px 0 0;color:var(--mute);font-size:14px}
.ov{position:fixed;inset:0;z-index:9;display:none;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#12306b,#071633 70%);padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.ov.show{display:block}
.ovb{max-width:420px;margin:0 auto;padding:24px 0}
.lgo{display:flex;justify-content:center;margin:6px 0 10px}
.splash{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer}
.splash h2{margin:0;font-size:32px}.splash h2 span{color:var(--gold)}.splash p{margin:0;font-size:14px;color:var(--mute)}
.splash path.dr{stroke-dasharray:150;stroke-dashoffset:150;animation:dr 1.6s .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.err{min-height:20px;margin:10px 0 6px;font-size:14px;color:#ff8a8a}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border-radius:14px;line-height:1.35}
.modal{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:rgba(7,22,51,.88);padding:16px}
.modal.show{display:flex}
.mb{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:20px}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:14px 0}
.qg div{text-align:center;font-size:12px;color:var(--mute)}.qg .q{background:#fff;padding:6px;border-radius:8px;margin-bottom:4px}.qg svg{width:100%;height:auto;display:block}

function clkModal(){const v=now_();modal(`<h3>Time and colours</h3><p class="sub">The room lights follow the timetable. Green means the room is free, red means a class is in session, blue means it is not a classroom. Set a time to test it, or go back to live South African time.</p>
<label class="lb">Day<select id="cday">${[1,2,3,4,5].map(d=>`<option value="${d}"${d===(clk.live?v[0]:clk.d)?' selected':''}>${DN[d]}</option>`).join('')}</select></label>
<label class="lb">Time <b id="ct">${fmt(clk.live?v[1]:clk.t)}</b><input id="ctime" type="range" min="7" max="18" step="0.25" value="${Math.min(18,Math.max(7,clk.live?v[1]:clk.t))}"></label>
<div class="btns"><button id="clive" class="${clk.live?'on':''}">Live time</button><button data-a="x">Close</button></div>`);
 const man=()=>{if(clk.live){clk.d=v[0]>=1&&v[0]<=5?v[0]:1;clk.t=v[1];clk.live=false}};
 $('cday').onchange=e=>{man();clk.d=+e.target.value;nt=-1e9;$('clive').classList.remove('on');if(view==='home')home()};
 $('ctime').oninput=e=>{man();clk.t=+e.target.value;nt=-1e9;$('ct').textContent=fmt(clk.t);$('clive').classList.remove('on');if(view==='home')home()};
 $('clive').onclick=()=>{clk.live=true;nt=-1e9;$('clive').classList.add('on');if(view==='home')home()}}
const TOK=[['Entrance','qr-entrance']].concat(FN.map((f,i)=>['Stairs, '+f.toLowerCase(),'qr-stairs-'+i]));
function qrModal(){modal(`<h3>QR codes</h3><p class="sub">Paste the web address of this app. The first code opens the app. The others open it and tell it where the student is standing.</p><input id="ql2" placeholder="https://" value="${esc(ls.get('wf_link')||'')}" aria-label="Web address of the app"><div class="qg" id="qg"></div><button data-a="x">Close</button>`);
 const draw=()=>{const l=$('ql2').value.trim();ls.set('wf_link',l);const g=$('qg');g.innerHTML='';if(!l||!window.qrcode){g.textContent=l?'The QR library did not load.':'Paste the address first.';return}
  const base=l.replace(/#.*$/,'');[['Open the app','']].concat(TOK).forEach(([n,t])=>{const q=qrcode(0,'M');q.addData(t?base+'#'+t:base);q.make();const d=document.createElement('div');d.innerHTML='<div class="q">'+q.createSvgTag(3,0)+'</div>';d.append(n);g.appendChild(d)})};
 $('ql2').oninput=draw;draw()}
function signout(){ls.set('wf_sess','');if(wk){wk=null;RL.visible=false}closeM();user='';qi=-1;setFocus(-1);auth('in')}
function act(e){const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,r=b.dataset.r!=null?RMS[+b.dataset.r]:null;
 if(a==='login')login();else if(a==='signup')signup();else if(a==='toup')auth('up');else if(a==='toin')auth('in');
 else if(a==='qual')pickQ(i);else if(a==='day'){day=i;home()}else if(a==='show')pick(r);else if(a==='go')go(r,b.dataset.c);
 else if(a==='here'){locV='r'+r.id;setLoc();roomV(r)}else if(a==='back'){unpick();setFocus(foc);home()}
 else if(a==='pp'){if(wk){wk.play=!wk.play;navV()}}else if(a==='nx')nextStep();else if(a==='stop')stopWalk();
 else if(a==='menu')menu();else if(a==='tour')tour();else if(a==='qrm')qrModal();else if(a==='clk')clkModal();
 else if(a==='req'){closeM();qualV()}else if(a==='out')signout();else if(a==='x')closeM()}
[sh,ov,$('md')].forEach(n=>n.addEventListener('click',act));
sc.addEventListener('change',e=>{if(e.target.id==='stp'){locV=e.target.value;setLoc()}});
ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const p=ov.querySelector('.pri');if(p)p.click()}});
$('gr').onclick=()=>sh.classList.toggle('min');
function readHash(){const h=location.hash.slice(1),m=/^qr-stairs-([0-2])$/.exec(h);if(h==='qr-entrance')locV='e';else if(m)locV='s'+m[1];setLoc();if(view==='home')home()}
addEventListener('hashchange',readHash);readHash();
{const s0=ls.get('wf_sess'),U=getU();if(s0&&U[s0]){user=s0;qi=U[s0].q==null?-1:U[s0].q}const d0=now_()[0];day=d0>=1&&d0<=5?d0:1}

/* ---- render loop ---- */
let last=performance.now();const hd=new T.Vector3();
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;let pos,lk;const k=1-Math.exp(-dt*4);
 if(wk){const q=wk.W[wk.i];if(wk.play)wk.t+=dt;
  if(wk.t<wk.dd){const e=ease(wk.t/wk.dd);pos=wk.f.p.clone().lerp(q.p,e);lk=wk.f.l.clone().lerp(q.l,e)}
  else{pos=q.p.clone();lk=q.l.clone();if(wk.play&&wk.t>wk.dd+q.hold){if(wk.i>=wk.W.length-1){wk.play=false;done=true;navV()}else{wk.f={p:q.p,l:q.l};wk.i++;wk.t=0;wk.dd=wk.W[wk.i].dur;const c=wk.W[wk.i].cap;if(c){steps.push(c);navV()}}}}}
 else{if(!drag&&!sel&&!reduce&&!ret)th+=dt*.04;tg.lerp(tgT,k);rad+=(radT-rad)*k;el+=(elT-el)*k;
  pos=new T.Vector3(tg.x+rad*Math.cos(el)*Math.sin(th),tg.y+rad*Math.sin(el),tg.z+rad*Math.cos(el)*Math.cos(th));lk=tg.clone();
  if(ret){ret.t=Math.min(1,ret.t+dt/1.4);const e=ease(ret.t);pos=ret.p.clone().lerp(pos,e);lk=ret.l.clone().lerp(lk,e);if(ret.t>=1)ret=null}}
 C.position.copy(pos);C.lookAt(lk);cur.p.copy(pos);cur.l.copy(lk);
 C.getWorldDirection(hd);$('cp').style.transform='rotate('+(-Math.atan2(hd.x,hd.z)*180/Math.PI)+'deg)';
 [[mW,.38],[mF,.45]].forEach(([m,o])=>{const t=wk?1:o;m.opacity+=(t-m.opacity)*Math.min(1,dt*4);if(wk&&m.opacity>.97)m.opacity=1;const tr=m.opacity<.98;if(m.transparent!==tr){m.transparent=tr;m.depthWrite=!tr;m.needsUpdate=true}});
 const O=oc(),tm=now/1000,wf=wk?wk.W[wk.i].fl:-1;
 GRP.forEach((g,f)=>{g.visible=!!wk||foc<0||f<=foc;LAB[f].forEach(l=>l.s.visible=wk?f===wf:(foc>=0&&f===foc)||l.r===sel)});
 BLE.forEach(b=>{const v=Math.pow(.5+.5*Math.sin(tm*5+b.ph),2),c=!b.r.tch?0x4d8dff:O[b.r.code]?0xff2a2a:0x2aff6a;b.m.color.setHex(c);b.h.color.setHex(c);b.m.opacity=.35+.65*v;b.h.opacity=v});
 R.render(S,C);requestAnimationFrame(loop)}
setFocus(-1);splash();requestAnimationFrame(loop);
})();
